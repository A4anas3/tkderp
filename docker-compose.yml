services:
  postgres:
    image: postgres:16-alpine
    container_name: thakurdwara-postgres
    restart: always
    environment:
      POSTGRES_USER: brightloop_user
      POSTGRES_PASSWORD: brightloop_password
      POSTGRES_DB: thakurdwara_erp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightloop_user -d thakurdwara_erp"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: thakurdwara-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: thakurdwara-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://brightloop_user:brightloop_password@postgres:5432/thakurdwara_erp
      SECRET_KEY: ThakurdwaraErpSuperSecretKeyMustBeVeryStrongAndSecure2026
      REDIS_URL: redis://redis:6379/0
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: thakurdwara-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  postgres_data:
  redis_data:
