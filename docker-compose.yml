# Thakurdwara ERP — FRESH production stack.
# Runs ALONGSIDE the old services (systemd backend :8080, frontend :5173,
# brightloop-postgres :5432, thakurdwara-redis :6379). Nothing here touches them.
# Secrets live ONLY in .env.production on this server (never in git).
# Start with: docker compose --env-file .env.production up -d --build
# Backend is reachable ONLY on 127.0.0.1:8081 (Cloudflare Tunnel points here).
# Postgres/Redis publish NO ports — container network only.
services:
  erp-thakurdwara-postgres:
    image: postgres:17-alpine
    container_name: erp-thakurdwara-postgres
    restart: unless-stopped
    mem_limit: 300m
    env_file:
      - .env.production
    volumes:
      - erp_thakurdwara_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U brightloop_user -d thakurdwara_erp]
      interval: 5s
      timeout: 5s
      retries: 10

  erp-thakurdwara-redis:
    image: redis:7-alpine
    container_name: erp-thakurdwara-redis
    restart: unless-stopped
    mem_limit: 60m
    command: [redis-server, --appendonly, yes, --maxmemory, 50mb, --maxmemory-policy, allkeys-lru]
    volumes:
      - erp_thakurdwara_redisdata:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  erp-thakurdwara-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: erp-thakurdwara-backend:latest
    container_name: erp-thakurdwara-backend
    restart: unless-stopped
    mem_limit: 256m
    env_file:
      - .env.production
    environment:
      PORT: 8080
    depends_on:
      erp-thakurdwara-postgres:
        condition: service_healthy
      erp-thakurdwara-redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:8081:8080
    volumes:
      - ./backend/uploads:/app/uploads

  erp-thakurdwara-cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: erp-thakurdwara-cloudflared
    restart: unless-stopped
    mem_limit: 64m
    env_file:
      - .env.production
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    depends_on:
      erp-thakurdwara-backend:
        condition: service_started

volumes:
  erp_thakurdwara_pgdata:
  erp_thakurdwara_redisdata:
